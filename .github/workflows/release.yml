name: release
# A release is the push of a tag; RELEASING.md describes the procedure. The tag decides what the run publishes:
#   v1.13.0        the GitHub release with Arend.jar, the API jars and arend-lib.zip, once a maintainer approves it
#   v1.13.0.1      nothing: a release of the plugin alone gets no GitHub release
#   v1.13.0-rc.1   a draft GitHub release, which only maintainers see: a rehearsal of v1.13.0
# The plugin zip, tested like the rest, is in the artifacts of the run, and a maintainer uploads it to Marketplace.
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      # To read the protection rules of the release environment
      actions: read
      # For the provenance attestation
      id-token: write
      attestations: write
    outputs:
      kind: ${{ steps.tag.outputs.kind }}
      rehearsal: ${{ steps.tag.outputs.rehearsal }}
      version: ${{ steps.tag.outputs.version }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Read the tag
      id: tag
      run: |
        if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?(-.+)?$ ]]; then
          echo "::error::$TAG is not a release tag: v1.13.0, v1.13.0.1 for the plugin alone, or v1.13.0-rc.1 for a rehearsal"
          exit 1
        fi
        echo "version=${BASH_REMATCH[1]}${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
        echo "kind=$([[ -z "${BASH_REMATCH[2]}" ]] && echo release || echo plugin)" >> "$GITHUB_OUTPUT"
        echo "rehearsal=$([[ -n "${BASH_REMATCH[3]}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
    # A job that names an environment which does not exist creates it, unprotected, and would publish without approval
    - name: Check that publishing waits for an approval
      if: steps.tag.outputs.kind == 'release'
      run: |
        reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" \
          --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length') || reviewers=0
        if [[ "$reviewers" == 0 ]]; then
          echo "::error::The release environment must exist and require a reviewer (Settings > Environments)"
          exit 1
        fi
    # Installed plugins find the library of their language version in arend-lib/versions on master
    - name: Check that master has the line of this version in arend-lib/versions
      if: steps.tag.outputs.kind == 'release' && steps.tag.outputs.rehearsal == 'false'
      env:
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/contents/arend-lib/versions?ref=master" -H 'Accept: application/vnd.github.raw' \
          | tr -d '\r' | grep -qxF "${VERSION%.*} -> $VERSION" \
          || { echo "::error::arend-lib/versions on master has no line '${VERSION%.*} -> $VERSION'; merge the release into master first"; exit 1; }
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - uses: gradle/actions/setup-gradle@v6
    - name: Test
      run: ./gradlew verifyReleaseMetadata check --continue --stacktrace -PreleaseTag="$TAG"
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: test-reports
        path: |
          build/reports/tests
          intellij/build/reports/tests
    # A separate invocation: combining jar tasks with test tasks in one build is unreliable
    - name: Build
      run: ./gradlew releaseAssets :intellij:verifyPlugin --stacktrace
    # Anyone can check that a file, the plugin zip on Marketplace included, was built here: gh attestation verify <file> -R arend-lang/Arend
    - uses: actions/attest-build-provenance@v4
      with:
        subject-path: |
          build/release/*.jar
          build/release/*.zip
    - uses: actions/upload-artifact@v7
      with:
        name: release
        path: build/release/
        if-no-files-found: error

  # The published files themselves, on every OS, on JDK 21: the oldest JDK the release supports
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - uses: actions/download-artifact@v8
      with:
        name: release
    - name: Check the checksums
      run: |
        if command -v sha256sum > /dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
    - name: Typecheck the released arend-lib with the released CLI
      run: |
        mkdir -p libs/arend-lib
        (cd libs/arend-lib && jar xf ../../arend-lib.zip)
        java -Xmx5g -jar Arend.jar --no-daemon -L libs arend-lib

  publish:
    needs: [build, smoke]
    if: needs.build.outputs.kind == 'release'
    runs-on: ubuntu-latest
    # Requires a maintainer's approval; the build job has checked that it does
    environment: release
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: release
    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        REHEARSAL: ${{ needs.build.outputs.rehearsal }}
      run: |
        flags=()
        if [[ "$REHEARSAL" == true ]]; then flags=(--draft --prerelease); fi
        gh release create "$TAG" Arend.jar Arend-api.jar Arend-api-sources.jar arend-lib.zip SHA256SUMS \
          --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file NOTES.md "${flags[@]}"

  # The URLs users and installed plugins download from
  post-check:
    needs: [build, publish]
    if: needs.build.outputs.kind == 'release' && needs.build.outputs.rehearsal == 'false'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
    - name: The download page links releases/latest
      run: |
        location=$(curl -sS -o /dev/null -w '%{redirect_url}' "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Arend.jar")
        if [[ "$location" != "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Arend.jar" ]]; then
          echo "::error::releases/latest/download/Arend.jar redirects to $location, not to the release $TAG"
          exit 1
        fi
    - name: The plugin reads arend-lib/versions from master
      run: |
        curl -fsS "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/master/arend-lib/versions" \
          | tr -d '\r' | grep -qxF "${VERSION%.*} -> $VERSION"
    - name: The plugin downloads arend-lib.zip from the release
      run: curl -fsSIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/arend-lib.zip"
