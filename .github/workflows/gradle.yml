name: gradle
on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR supersedes its running build; every master and staging commit keeps its own result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gradle:
    strategy:
      # A failure on one OS must not cancel the others before they report
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
    # Gradle runs on JDK 21; the JDK 25 toolchain of :intellij is provisioned by the foojay resolver (settings.gradle.kts)
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - uses: gradle/actions/setup-gradle@v6
    - run: ./gradlew check --continue --stacktrace
    # The full output of the failed tests, which the log shortens
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: test-reports-${{ matrix.os }}
        path: |
          build/reports/tests
          intellij/build/reports/tests
    # A separate invocation: combining jar tasks with test tasks in one build is unreliable
    - if: matrix.os == 'ubuntu-latest'
      run: ./gradlew :api:jar :api:sourcesJar :cli:jarDep --stacktrace
    - uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: API
        path: api/build/libs
    - uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: Arend
        path: cli/build/libs
