name: weekly
# The plugin against the EAP and RC builds of the next IntelliJ platform, as early warning: most plugin-only releases so
# far (1.10.0.1-3, 1.11.0.1-2) were platform updates. GitHub runs scheduled workflows on the default branch only.
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - uses: gradle/actions/setup-gradle@v6
    - run: ./gradlew :intellij:verifyPlugin -PverifyPluginEap --stacktrace
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: plugin-verifier-report
        path: intellij/build/reports/pluginVerifier
